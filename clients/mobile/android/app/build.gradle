apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.asegurapatrimonio.app"
    defaultConfig {
        applicationId "com.asegurapatrimonio.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Configuración Segura de Firma de Producción para Google Play Store
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            } else {
                // Fallback a variables de entorno de producción
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE") ?: "release.keystore")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "dummy_pass"
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "dummy_alias"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: "dummy_pass"
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Habilitar firma de producción para Play Store
            signingConfig signingConfigs.release
            
            // Habilitar ofuscación de Proguard para proteger la propiedad intelectual
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the react plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
